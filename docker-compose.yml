version: '3.8'

services:
  garmin_mysql:
    image: mysql:8.0
    container_name: garmin_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_here}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-garmin_db}
      MYSQL_USER: ${MYSQL_USER:-garmin_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-garmin_secure_password_here}
      TZ: Europe/Riga
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=256M
      --innodb_buffer_pool_size=512M
    volumes:
      - mysql_data:/var/lib/mysql
      # Optional: Auto-initialize on first container startup if volume is empty
      - ./garmin_db/garmin_mysql_dump.sql:/docker-entrypoint-initdb.d/01_garmin_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_password_here}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
